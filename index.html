<!doctype html>
<html lang="pt">

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Clique nos três pontinhos →">

<link rel="preload" as="image" href="tutorial.gif" fetchpriority="high">

<meta property="og:title" content="Clique nos três pontinhos →">
<meta property="og:description" content="Siga o tutorial para acessar o WhatsApp">
<meta property="og:type" content="website">
<meta property="og:image" content="tutorial.gif">

<title>Acesse o WhatsApp</title>

<style>
:root {
    --bg: #000;
    --card: #111;
    --text: #fff;
    --muted: #aaa;
    --accent: #25D366;
    --accent-light: #35e077;
    --border: #333;
    --shadow: 0 8px 30px rgba(0,0,0,0.5);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    height: 100%;
    overflow-x: hidden;
}

.wrap {
    max-width: 420px;
    margin: 0 auto;
    padding: 18px;
    padding-top: 60px;
    padding-bottom: 30px;
    opacity: 0;
    transition: opacity 0.4s;
}

.card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
}

.guide-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 10px;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.arrow {
    font-size: 22px;
    animation: bounce 1.2s infinite;
}

@keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(6px); }
    60% { transform: translateY(3px); }
}

.visual {
    width: 100%;
    margin-bottom: 12px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--border);
}

.visual img {
    width: 100%;
    display: block;
}

.steps {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.step {
    display: flex;
    gap: 8px;
    align-items: flex-start;
}

.num {
    color: var(--accent);
    font-weight: 800;
    min-width: 22px;
    font-size: 15px;
}

.txt {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    flex: 1;
}

.txt strong {
    color: var(--accent);
    font-weight: 700;
}

.cta {
    margin-top: 12px;
}

.btn-main {
    width: 100%;
    background: var(--accent);
    color: #fff;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(37, 211, 102, 0.4);
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.btn-main:hover {
    background: var(--accent-light);
    transform: translateY(-3px);
}

.lang-selector {
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 1000;
}

.lang-btn {
    background: #fff;
    border: 1px solid #eee;
    padding: 8px 12px;
    border-radius: 99px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    gap: 6px;
    align-items: center;
    color: #111;
}

.lang-dropdown {
    position: absolute;
    bottom: 50px;
    right: 0;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    display: none;
    flex-direction: column;
    min-width: 130px;
    overflow: hidden;
}

.lang-dropdown.open {
    display: flex;
}

.lang-opt {
    background: none;
    border: 0;
    padding: 10px;
    text-align: left;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    display: flex;
    gap: 8px;
    width: 100%;
    color: #111;
}

.lang-opt:hover {
    background: #f5f5f5;
}
</style>
</head>

<body>

<div id="app-root"></div>

<script>
(function() {

const WHATSAPP_LINK = "https://api.whatsapp.com/send?phone=5521979567308&text=Oii%2C%20Tudo%20bem%2C%20como%20funciona%20pode%20me%20explicar%3F";

const LANG_CONFIG = {
    pt: { flag: '🇧🇷', name: 'PT' },
    en: { flag: '🇺🇸', name: 'EN' },
    es: { flag: '🇪🇸', name: 'ES' }
};

const TEXTS = {
    pt: {
        title: "SIGA O TUTORIAL ABAIXO",
        step1: 'Toque nos <strong>três pontinhos</strong> (canto superior da tela)',
        step2: 'Escolha <strong>"Abrir no navegador"</strong>',
        step3: 'Agora toque no botão verde para abrir o WhatsApp',
        button: "ABRIR WHATSAPP"
    },

    es: {
        title: "SIGUE EL TUTORIAL",
        step1: 'Toca los <strong>tres puntos</strong>',
        step2: 'Elige <strong>"Abrir en el navegador"</strong>',
        step3: 'Ahora toca el botón verde para abrir WhatsApp',
        button: "ABRIR WHATSAPP"
    },

    en: {
        title: "FOLLOW THE TUTORIAL",
        step1: 'Tap the <strong>three dots</strong>',
        step2: 'Choose <strong>"Open in browser"</strong>',
        step3: 'Now tap the green button to open WhatsApp',
        button: "OPEN WHATSAPP"
    }
};

function render(lang) {

    const t = TEXTS[lang];
    const currentConfig = LANG_CONFIG[lang];

    document.getElementById('app-root').innerHTML = `
    
    <div class="lang-selector">
        <button class="lang-btn" id="langBtn">
            <span>${currentConfig.flag}</span> ${currentConfig.name} ▴
        </button>

        <div class="lang-dropdown" id="langDropdown"></div>
    </div>

    <div class="wrap" id="mainWrap">

        <div class="card">

            <div class="guide-title">
                <span>${t.title}</span>
                <span class="arrow">👇</span>
            </div>

            <div class="visual">
                <img src="tutorial.gif" alt="Tutorial">
            </div>

            <div class="steps">

                <div class="step">
                    <div class="num">1)</div>
                    <div class="txt">${t.step1}</div>
                </div>

                <div class="step">
                    <div class="num">2)</div>
                    <div class="txt">${t.step2}</div>
                </div>

                <div class="step">
                    <div class="num">3)</div>
                    <div class="txt">${t.step3}</div>
                </div>

            </div>

            <div class="cta">
                <button class="btn-main" id="openBtn">
                    ${t.button}
                </button>
            </div>

        </div>

    </div>
    `;

    const openBtn = document.getElementById('openBtn');
    const langBtn = document.getElementById('langBtn');
    const langDropdown = document.getElementById('langDropdown');

    openBtn.addEventListener('click', () => {
        window.location.href = WHATSAPP_LINK;
    });

    setTimeout(() => {
        window.location.href = WHATSAPP_LINK;
    }, 1500);

    langBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        langDropdown.classList.toggle('open');
    });

    Object.keys(LANG_CONFIG).forEach(code => {

        const opt = document.createElement('button');

        opt.className = 'lang-opt';

        opt.innerHTML = `
            <span>${LANG_CONFIG[code].flag}</span>
            ${LANG_CONFIG[code].name}
        `;

        opt.addEventListener('click', () => {
            render(code);
        });

        langDropdown.appendChild(opt);
    });

    document.addEventListener('click', () => {
        langDropdown.classList.remove('open');
    });

    setTimeout(() => {
        document.getElementById('mainWrap').style.opacity = "1";
    }, 10);
}

render('pt');

})();
</script>

</body>
</html>
