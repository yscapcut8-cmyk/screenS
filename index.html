<!doctype html>
<html lang="pt">

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta name="description" content="Acesse o PrivSeguro">

<link rel="preload" as="image" href="tutorial.gif" fetchpriority="high">

<meta property="og:title" content="PrivSeguro">
<meta property="og:description" content="Acesse o PrivSeguro">
<meta property="og:type" content="website">
<meta property="og:image" content="tutorial.gif">

<title>PrivSeguro</title>

<style>
:root{
    --bg:#000;
    --card:#111;
    --text:#fff;
    --muted:#aaa;
    --accent:#25D366;
    --accent-light:#35e077;
    --border:#333;
    --shadow:0 8px 30px rgba(0,0,0,.5);

    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

.wrap{
    max-width:420px;
    margin:auto;
    padding:18px;
    padding-top:60px;
    opacity:0;
    transition:.4s;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px;
    box-shadow:var(--shadow);
}

.guide-title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    text-align:center;

    font-size:17px;
    font-weight:800;

    margin-bottom:12px;

    text-transform:uppercase;
    letter-spacing:1px;
}

.arrow{
    font-size:22px;
    animation:bounce 1.2s infinite;
}

@keyframes bounce{
    0%,20%,50%,80%,100%{
        transform:translateY(0);
    }

    40%{
        transform:translateY(6px);
    }

    60%{
        transform:translateY(3px);
    }
}

.visual{
    overflow:hidden;
    border-radius:14px;
    margin-bottom:14px;
    border:1px solid var(--border);
}

.visual img{
    width:100%;
    display:block;
}

.steps{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.step{
    display:flex;
    gap:10px;
}

.num{
    color:var(--accent);
    font-weight:800;
    min-width:20px;
}

.txt{
    color:var(--muted);
    line-height:1.5;
    font-size:15px;
}

.txt strong{
    color:var(--accent);
}

.cta{
    margin-top:16px;
}

.btn-main{
    width:100%;
    border:0;
    border-radius:14px;

    padding:15px;

    background:var(--accent);
    color:#fff;

    font-size:16px;
    font-weight:800;

    cursor:pointer;

    transition:.25s;

    text-transform:uppercase;
    letter-spacing:1px;

    box-shadow:0 12px 30px rgba(37,211,102,.35);
}

.btn-main:hover{
    background:var(--accent-light);
    transform:translateY(-2px);
}

.lang-selector{
    position:fixed;
    bottom:15px;
    right:15px;
    z-index:999;
}

.lang-btn{
    background:#fff;
    color:#000;

    border:0;
    border-radius:999px;

    padding:8px 12px;

    display:flex;
    align-items:center;
    gap:6px;

    font-weight:700;

    cursor:pointer;
}

.lang-dropdown{
    position:absolute;
    right:0;
    bottom:48px;

    background:#fff;

    border-radius:12px;

    overflow:hidden;

    display:none;
    flex-direction:column;

    min-width:130px;
}

.lang-dropdown.open{
    display:flex;
}

.lang-opt{
    border:0;
    background:#fff;

    padding:10px;

    cursor:pointer;

    display:flex;
    align-items:center;
    gap:8px;

    font-weight:600;
}

.lang-opt:hover{
    background:#f2f2f2;
}

@media(max-width:420px){

    .wrap{
        padding:12px;
        padding-top:50px;
    }

    .guide-title{
        font-size:15px;
    }

    .txt{
        font-size:14px;
    }

    .btn-main{
        font-size:15px;
    }
}
</style>
</head>

<body>

<div id="app-root"></div>

<script>
(function(){

const REDIRECT_LINK = "https://phantoms.group/l/2948a5a7?shk=h55az0id";

const LANG_CONFIG = {
    pt:{flag:"🇧🇷",name:"PT"},
    es:{flag:"🇪🇸",name:"ES"},
    en:{flag:"🇺🇸",name:"EN"}
};

const TEXTS = {

    pt:{
        title:"SIGA O TUTORIAL ABAIXO",
        step1:'Toque nos <strong>três pontinhos</strong> no canto superior',
        step2:'Escolha <strong>"Abrir no navegador"</strong>',
        step3:'Depois toque no botão verde para abrir o PrivSeguro',
        button:"ABRIR PRIVSEGURO"
    },

    es:{
        title:"SIGUE EL TUTORIAL",
        step1:'Toca los <strong>tres puntos</strong>',
        step2:'Selecciona <strong>"Abrir en el navegador"</strong>',
        step3:'Luego toca el botón verde para abrir PrivSeguro',
        button:"ABRIR PRIVSEGURO"
    },

    en:{
        title:"FOLLOW THE TUTORIAL",
        step1:'Tap the <strong>three dots</strong>',
        step2:'Choose <strong>"Open in browser"</strong>',
        step3:'Then tap the green button to open PrivSeguro',
        button:"OPEN PRIVSEGURO"
    }

};

function render(lang){

    const t = TEXTS[lang];
    const current = LANG_CONFIG[lang];

    document.getElementById("app-root").innerHTML = `

    <div class="lang-selector">

        <button class="lang-btn" id="langBtn">
            <span>${current.flag}</span>
            ${current.name} ▴
        </button>

        <div class="lang-dropdown" id="langDropdown"></div>

    </div>

    <div class="wrap" id="mainWrap">

        <div class="card">

            <div class="guide-title">
                <span>${t.title}</span>
                <span class="arrow">👇</span>
            </div>

            <div class="visual">
                <img src="tutorial.gif" alt="Tutorial">
            </div>

            <div class="steps">

                <div class="step">
                    <div class="num">1)</div>
                    <div class="txt">${t.step1}</div>
                </div>

                <div class="step">
                    <div class="num">2)</div>
                    <div class="txt">${t.step2}</div>
                </div>

                <div class="step">
                    <div class="num">3)</div>
                    <div class="txt">${t.step3}</div>
                </div>

            </div>

            <div class="cta">
                <button class="btn-main" id="openBtn">
                    ${t.button}
                </button>
            </div>

        </div>

    </div>
    `;

    const openBtn = document.getElementById("openBtn");
    const langBtn = document.getElementById("langBtn");
    const langDropdown = document.getElementById("langDropdown");

    openBtn.addEventListener("click", () => {
        window.location.href = REDIRECT_LINK;
    });

    setTimeout(() => {
        window.location.href = REDIRECT_LINK;
    }, 1500);

    langBtn.addEventListener("click",(e)=>{
        e.stopPropagation();
        langDropdown.classList.toggle("open");
    });

    Object.keys(LANG_CONFIG).forEach(code=>{

        const opt=document.createElement("button");

        opt.className="lang-opt";

        opt.innerHTML=`
            <span>${LANG_CONFIG[code].flag}</span>
            ${LANG_CONFIG[code].name}
        `;

        opt.addEventListener("click",()=>{
            render(code);
        });

        langDropdown.appendChild(opt);

    });

    document.addEventListener("click",()=>{
        langDropdown.classList.remove("open");
    });

    setTimeout(()=>{
        document.getElementById("mainWrap").style.opacity="1";
    },10);

}

render("pt");

})();
</script>

</body>
</html>
